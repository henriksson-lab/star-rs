[package]
name = "star-rs"
version = "0.2.0"
edition = "2024"
description = "Rust translation of the STAR RNA-seq aligner (experimental, LLM-mediated)"
license = "MIT"
repository = "https://github.com/henriksson-lab/star-rs"
readme = "README.md"
keywords = ["bioinformatics", "rna-seq", "aligner", "genomics", "star"]
categories = ["science", "command-line-utilities"]

[features]
default = []
binary = []
tracehash = ["dep:tracehash-rs"]

[[bin]]
name = "star-rs"
path = "src/main.rs"
required-features = ["binary"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
flate2 = "1.0"
libc = "0.2"
rayon = "1.10"
tracehash-rs = { version = "0.2.0", optional = true }

[target.'cfg(windows)'.dependencies]
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
